name: Build Nischay Pulse APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Fixed Release Keystore & Print SHA-1
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/nischay-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias nischaykey -storepass nischay123 -keypass nischay123 -dname "CN=Prince Kumar, OU=Nischay, O=NischayPulse, L=Telwa, S=Bihar, C=IN"
          echo "=== COPY THIS SHA-1 FOR GOOGLE CLOUD ANDROID CLIENT ==="
          keytool -list -v -keystore app/nischay-release.jks -alias nischaykey -storepass nischay123 | grep "SHA1:"

      - name: Build Signed Release APK
        run: gradle assembleRelease

      - name: Upload Nischay Pulse APK
        uses: actions/upload-artifact@v4
        with:
          name: Nischay-Pulse-Pro-APK
          path: app/build/outputs/apk/release/app-release.apk
